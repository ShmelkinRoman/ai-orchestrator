# Multi-model routing config.
# `pick_model(role, risk, project_confidential)` reads from this file.
# Env vars: QWEN_ENABLED, PROJECT_CONFIDENTIAL (see config/settings.py).

roles:
  triage:           claude-haiku-4-5      # дёшево, быстро
  intake:           claude-haiku-4-5
  architect_low:
    model:          claude-sonnet-4-6     # low / medium risk
    temperature:    0.2
    max_tokens:     4096
  architect_high:
    model:          claude-opus-4-7       # high risk
    temperature:    0.2
    max_tokens:     4096
  developer:        claude-sonnet-4-6     # default cloud developer
  reviewer_low:
    model:          claude-sonnet-4-6
    max_tokens:     2048
  reviewer_high:
    model:          claude-opus-4-7
    max_tokens:     2048
  docs:             claude-haiku-4-5

# Локальный исполнитель (Qwen via Aider). Включается через QWEN_ENABLED=true.
local_developer:
  model:           qwen-local
  fallback:        claude-sonnet-4-6
  max_file_lines:  200                    # Qwen стабильно работает только до 200 строк

# Дешёвый облачный исполнитель — разрешён только для non-confidential, low-risk.
# Routing rule (enforced in agents/llm.py:pick_developer): risk == low and not project.confidential
cheap_developer:
  model:           deepseek-coder
