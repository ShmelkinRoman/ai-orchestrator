<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — AI Orchestrator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-4">
    <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">AI Orchestrator</h1>
    <p class="text-center text-gray-500 text-sm mb-8">Веб-панель управления</p>

    <div class="bg-gray-900 rounded-xl p-6 border border-gray-800 shadow-xl">
      <form method="post" action="/login" class="space-y-4">
        {% if error %}
        <div class="text-red-400 text-sm text-center bg-red-900/30 rounded-lg px-3 py-2">
          {{ error }}
        </div>
        {% endif %}
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Токен доступа</label>
          <input
            type="password"
            name="token"
            autofocus
            placeholder="WEBUI_TOKEN"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white
                   placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-lg px-4 py-2.5
                 font-medium transition-colors text-sm">
          Войти
        </button>
      </form>
    </div>
  </div>
</body>
</html>
